[project]
name = "agent-hub"
version = "0.1.0"
description = "agent-hub — hub điều phối đội agent chạy trên `claude` CLI (mốc M0: lõi chạy 1 agent)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "mcp>=1.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "textual>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
agent-hub = "agent_hub.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
