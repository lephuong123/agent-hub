[project]
name = "cfharness"
version = "0.2.9"
description = "cfharness — hub điều phối đội agent chạy trên `claude` CLI (mốc M0: lõi chạy 1 agent)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "mcp>=1.9",
    "mdit-py-plugins>=0.4",
    "prompt-toolkit>=3.0.40",
    "pydantic>=2.7",
    "pygments>=2.17",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
    "pyyaml>=6.0",
    "segno>=1.6",
    "starlette>=0.40",
    "textual>=1.0",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
# Graph memory: kênh vector BAAI/bge-m3 (dense 1024-d) qua fastembed (onnxruntime, không torch) + sqlite-vec (khoảng cách trong SQLite).
# Không cài → chỉ FTS5. Model (~2.3 GB) chỉ được tải khi daemon chạy vòng nền lần đầu, vào HUB_HOME/models.
vector = [
    "fastembed>=0.7",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
cfharness = "cfharness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfharness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
