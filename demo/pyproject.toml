[project]
name = "agent-hub-demo"
version = "0.1.0"
description = "Bản demo TUI 'htop cho agent' của agent-hub (dữ liệu giả lập)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "textual>=1.0",
    "pydantic>=2.7",
]

[project.scripts]
agent-hub-demo = "agent_hub_demo.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub_demo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
