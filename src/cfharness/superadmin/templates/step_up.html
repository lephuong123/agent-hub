{% extends "base.html" %}
{% block title %}Xác nhận lại{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Xác nhận bằng mã TOTP</h1>
  <p>Thao tác {% if pending %}<b>{{ pending.label or pending.op }}</b> {% endif %}cần nhập lại mã TOTP (có hiệu lực 5 phút).</p>
  <form method="post" action="/step-up" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Mã TOTP <input name="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" autofocus required></label>
    <button class="btn primary">Xác nhận{% if pending %} và chạy{% endif %}</button>
  </form>
</section>
{% endblock %}
