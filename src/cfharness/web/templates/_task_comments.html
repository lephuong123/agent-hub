<div id="task-comments"{% if oob %} hx-swap-oob="true"{% endif %}>{% for c in t.comments %}<div class="comment{{ ' answer' if c.kind == 'answer' }}"><div class="comment-h">{% if c.kind == 'answer' %}{{ m.icon('check') }}{% endif %}<b>{{ c.author }}</b> <span class="muted small">{{ 'trả lời câu hỏi' if c.kind == 'answer' else c.kind }} · {{ c.created_at|ts }}</span></div><div class="md">{{ c.text|md }}</div></div>{% else %}<p class="muted small">Chưa có bình luận.</p>{% endfor %}</div>
