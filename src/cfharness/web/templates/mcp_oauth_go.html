<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="0;url={{ url }}">
<title>Đăng nhập {{ name }} · cfharness</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="main"><section class="card narrow">
  <h1>Đăng nhập {{ name }}</h1>
  <p>Đang mở trang đăng nhập của <b>{{ host }}</b>… Sau khi đăng nhập, trình duyệt sẽ quay lại hub.</p>
  <div class="row end gap"><a class="btn ghost" href="{{ back }}">Huỷ</a><a class="btn primary" href="{{ url }}" rel="noreferrer">Tiếp tục tới {{ host }}</a></div>
</section></main>
</body>
</html>
