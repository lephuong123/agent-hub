{#- Mục của trang Điều phối. Chữ của điều phối viên là DỮ LIỆU: vẽ qua present.md() đã cứng hoá (filter `md`, tx_msg) — đầu ra DUY NHẤT
    được |safe. Tin của người: autoescape + pre-wrap. Văn bản gốc cho nút Sao chép/Sửa nằm trong <template class="mm-src"> (autoescape).
    Nút thao tác dùng data-mm (app.js uỷ quyền) — không on*=. -#}
{% import "_macros.html" as mc with context %}
{% import "_transcript.html" as tx %}
{% macro item(it) -%}
{%- if it.kind == 'user' -%}
<div class="mm user"{% if it.run_id %} data-run="{{ it.run_id }}"{% endif %}><div class="mm-text">{{ it.text }}</div><div class="mm-foot">{% if it.ts %}{{ mc.rel(it.ts) }}{% endif %}<button type="button" class="mm-btn" data-mm="copy" title="Sao chép" aria-label="Sao chép tin">{{ mc.icon('copy', 'sm') }}</button><button type="button" class="mm-btn" data-mm="edit" title="Sửa — đưa tin này vào ô nhập" aria-label="Sửa tin">{{ mc.icon('edit', 'sm') }}</button></div><template class="mm-src">{{ it.text }}</template></div>
{%- elif it.kind == 'manager' -%}
<div class="mm mgr{{ ' notify' if it.notify }}"{% if it.run_id %} data-run="{{ it.run_id }}"{% endif %}><div class="mm-who"><span class="mm-mark" aria-hidden="true">{{ mc.icon('logo') }}</span>{% if it.notify %}{{ mc.icon('alert', 'sm') }}Điều phối viên báo{% else %}{{ 'Điều phối viên · nhịp' if it.tick else 'Điều phối viên' }}{% endif %}</div>{{ tx.tx_msg({'html': (it.text or '(không có nội dung)')|md, 'seq': none}, 'mm-md') }}<div class="mm-foot"><button type="button" class="mm-btn" data-mm="copy" title="Sao chép" aria-label="Sao chép câu trả lời">{{ mc.icon('copy', 'sm') }}</button>{% if not it.notify %}<button type="button" class="mm-btn mm-retry" data-mm="retry" title="Thử lại — gửi lại tin cuối của bạn" aria-label="Thử lại">{{ mc.icon('refresh', 'sm') }}</button>{% endif %}{% if it.ts %}{{ mc.rel(it.ts) }}{% endif %}{% if it.run_id %}<a href="/runs/{{ it.run_id }}">xem lượt chạy</a>{% endif %}</div><template class="mm-src">{{ it.text }}</template></div>
{%- elif it.kind == 'actions' -%}
<details class="mm-acts{{ ' err' if not it.ok }}"{% if it.run_id %} data-run="{{ it.run_id }}"{% endif %}><summary><span class="mm-acts-ic">{{ mc.icon('check' if it.ok else 'alert', 'sm') }}<span class="tx-spin" aria-hidden="true"></span></span><span class="mm-acts-n">Đã làm <span class="n">{{ it['items']|length }}</span> việc</span><span class="mm-acts-last">{% if it['items'] %}{{ it['items'][-1].summary|first(60) }}{% endif %}</span>{{ mc.icon('chev-right', 'chev') }}</summary><div class="mm-acts-list">{% for a in it['items'] %}{{ item(a) }}{% endfor %}</div></details>
{%- elif it.kind == 'action' -%}
<div class="mm-act{{ ' err' if not it.ok }}"{% if it.run_id %} data-run="{{ it.run_id }}"{% endif %}><span class="mm-act-ic">{{ mc.icon('check' if it.ok else 'x', 'sm') }}</span><div class="mm-act-body"><div class="mm-act-sum">{{ it.summary }}</div><div class="mm-act-meta">{% if it.target.href %}<a href="{{ it.target.href }}">{{ it.target.label }}</a>{% elif it.target.label %}<span>{{ it.target.label }}</span>{% endif %}{% if it.tool %}<code>{{ it.tool }}</code>{% endif %}{% if it.ts %}<span>{{ it.ts|ts }}</span>{% endif %}{% if it.error %}<span class="danger-t">{{ it.error }}</span>{% endif %}</div></div></div>
{%- elif it.kind == 'question' -%}
{{ mc.question_card(it.q, "/manager" ~ ("?c=" ~ it.q.conversation_id if it.q.conversation_id else "")) }}
{%- elif it.kind == 'note' -%}
<div class="mm-note {{ it.tone }}"{% if it.run_id %} data-run="{{ it.run_id }}"{% endif %}>{{ it.text }}{% if it.run_id %} · <a href="/runs/{{ it.run_id }}">xem lượt chạy</a>{% endif %}</div>
{%- endif -%}
{%- endmacro %}

{% macro answered(q) -%}
<div class="q-answer">{{ mc.icon('check') }}<div class="pre"><b>{{ 'Điều phối viên' if (q.answered_by or '').startswith('manager:') else 'Bạn' }}</b> đã trả lời: {% for k in (q.answer or {}).get('keys') or [] %}{{ k }}. {{ ((q.answer or {}).get('labels') or [])[loop.index0] }}{{ '; ' if not loop.last }}{% endfor %}{% if (q.answer or {}).get('text') %} — {{ q.answer.text }}{% endif %}</div></div>
{%- endmacro %}

{% macro pending(run_id) -%}
<div class="mm mgr pending" data-pending="{{ run_id }}" aria-busy="true"><div class="mm-who"><span class="mm-mark thinking" aria-hidden="true">{{ mc.icon('logo') }}</span>Điều phối viên<span class="mm-state"> · <span class="spin">đang nghĩ…</span></span> · <a href="/runs/{{ run_id }}">xem lượt chạy</a></div><details class="mm-think" hidden><summary>Suy nghĩ…</summary><pre></pre></details><div class="ti msg tx-msg mm-md mm-live"><div class="md"></div><div class="mm-tail"></div></div><div class="mm-tool" hidden><span class="tx-spin" aria-hidden="true"></span><span class="mm-tool-t"></span></div></div>
{%- endmacro %}

{% macro side_action(it) -%}
<li class="fl {{ 'ok' if it.ok else 'danger' }}"><span class="fl-dot" aria-hidden="true"></span><span class="fl-main"><span class="fl-text">{{ it.summary }}</span>{% if it.target.href %} · <a href="{{ it.target.href }}">{{ it.target.label }}</a>{% endif %}</span><span class="fl-ts">{{ it.ts|ts }}</span></li>
{%- endmacro %}
