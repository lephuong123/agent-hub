{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% block title %}Công việc{% endblock %}
{% block content %}
<div class="page-head"><div class="ph-title"><h1>Công việc</h1><span class="sub">Task giao cho agent hoặc team; task có phụ thuộc chạy sau khi task cha xong.</span></div>
  <form method="get" action="/tasks" class="filters inline-f">
    <select name="team" aria-label="Lọc theo team"><option value="">mọi team</option>{% for t in teams %}<option value="{{ t.id }}" {{ 'selected' if q.team == t.id }}>{{ t.name }}</option>{% endfor %}</select>
    <button class="btn sm" type="submit">Lọc</button>
  </form>
</div>
<details class="card" {{ 'open' if not cols.values()|sum(start=[]) }}>
  <summary><h2 class="inline-h">Tạo công việc</h2></summary>
  <form method="post" action="/do/task_create" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="/tasks">
    <div class="fgrid">
      <label class="span2">Tiêu đề <input name="title" required placeholder="vd: Viết tài liệu cài đặt"></label>
      <label class="span2">Mô tả chi tiết <textarea name="body" rows="4" placeholder="Yêu cầu, tiêu chí xong, đường dẫn liên quan…"></textarea></label>
      <label>Giao cho agent <select name="assignee"><option value="">(để team tự phân)</option>{% for a in agents %}<option value="{{ a }}">{{ a }}</option>{% endfor %}</select></label>
      <label>Hoặc giao cho team <select name="team"><option value="">(không)</option>{% for t in teams if not t.archived_at %}<option value="{{ t.id }}">{{ t.name }}</option>{% endfor %}</select></label>
      <label class="span2">Phụ thuộc (chạy sau khi các task này xong) <select name="parents" multiple size="{{ [open_tasks|length, 5]|min or 1 }}">{% for t in open_tasks %}<option value="{{ t.id }}">{{ t.id }} — {{ t.title|first(60) }}</option>{% endfor %}</select><span class="hint">Giữ Ctrl/⌘ để chọn nhiều</span></label>
      <label>Ưu tiên <input name="priority" type="number" value="0" min="-10" max="10"></label>
    </div>
    <div class="row end"><button class="btn primary" type="submit">Tạo công việc</button></div>
  </form>
</details>
{% include "_tasks_board.html" %}
{% endblock %}
