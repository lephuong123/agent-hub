{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% block title %}Task {{ t.id }}{% endblock %}
{% block content %}
{% include "_task_main.html" %}
<section class="card">
  <h2>Bình luận</h2>
  {% include "_task_comments.html" %}
  <form method="post" action="/do/task_comment" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ t.id }}"><input type="hidden" name="next" value="/tasks/{{ t.id }}">
    <textarea data-voice name="text" rows="2" required placeholder="Viết bình luận…"></textarea>
    <div class="row between wrap-row"><label class="check small"><input type="checkbox" name="steer" value="1"> Gửi luôn vào run đang chạy (steer)</label><button class="btn primary" type="submit">Gửi</button></div>
  </form>
</section>
{% endblock %}
